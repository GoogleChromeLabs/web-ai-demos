<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt API WebLLM Test</title>
    <style>
      body {
        font-family: system-ui;
        max-width: 600px;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      progress {
        width: 100%;
        height: 2rem;
      }
      #status {
        margin-top: 1rem;
        font-weight: bold;
      }
      pre {
        background: #f4f4f4;
        padding: 1rem;
        overflow-x: auto;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Prompt API WebLLM Test</h1>
    <div id="polyfill-mode-banner"></div>
    <p>This page tests the WebLLM backend with explicit configuration.</p>

    <label for="progress">Model Download Progress:</label>
    <progress id="progress" value="0" max="1"></progress>

    <div id="status">Ready</div>
    <pre id="output"></pre>

    <script src="./demo-polyfill-mode.js"></script>
    <script>
      setupPolyfillModeBanner({
        apiName: 'LanguageModel',
        forceFlag: '__FORCE_PROMPT_API_POLYFILL__',
      });
    </script>
    <script type="module">
      // WebLLM backend configuration imported from a JSON file, if present.
      // WebLLM runs entirely in-browser, so a missing file just falls back
      // to a dummy API key instead of breaking the page.
      let webllmConfig;
      try {
        const res = await fetch('./.env-webllm.json');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        webllmConfig = await res.json();
      } catch {
        console.warn(
          'No .env-webllm.json found; using a dummy config. Create ' +
            '.env-webllm.json to override the default model.'
        );
        webllmConfig = { apiKey: 'dummy' };
      }
      window.WEBLLM_CONFIG = webllmConfig;

      import './prompt-api-polyfill.js';

      const status = document.getElementById('status');
      const output = document.getElementById('output');
      const progressBar = document.getElementById('progress');

      // Resolves once the user has interacted with the page. A model download
      // needs user activation, which a tap, click, or key press grants.
      const waitForUserActivation = () =>
        new Promise((resolve) => {
          const controller = new AbortController();
          const onInteraction = () => {
            if (navigator.userActivation.isActive) {
              controller.abort();
              resolve();
            }
          };
          for (const type of [
            'keydown',
            'mousedown',
            'pointerup',
            'touchend',
          ]) {
            document.addEventListener(type, onInteraction, {
              capture: true,
              signal: controller.signal,
            });
          }
        });

      async function runTest() {
        try {
          status.textContent = 'Initializing LanguageModel (WebLLM)...';
          // Shared by `availability()` and `create()`, so both ask about the
          // same session.
          const options = {
            expectedInputs: [{ type: 'text', languages: ['en'] }],
            expectedOutputs: [{ type: 'text', languages: ['en'] }],
          };
          const availability = await LanguageModel.availability(options);
          if (availability === 'unavailable') {
            throw new Error('LanguageModel is unavailable.');
          }
          // The test runs on page load, which has no user activation yet.
          if (
            availability !== 'available' &&
            !navigator.userActivation.isActive
          ) {
            status.textContent =
              'Click anywhere or press a key to download the model.';
            await waitForUserActivation();
          }
          const session = await LanguageModel.create({
            ...options,
            monitor: (m) => {
              m.addEventListener('downloadprogress', (e) => {
                console.log('Download progress:', e.loaded);
                progressBar.value = e.loaded;
                status.textContent = `Downloading model: ${Math.round(e.loaded * 100)}%`;
              });
            },
          });

          status.textContent = 'Session created. Sending prompt...';
          const response = await session.prompt(
            'What is 2+2? Answer in one word.'
          );
          output.textContent = response;
          status.textContent = 'Done!';
        } catch (err) {
          console.error(err);
          status.textContent = 'Error: ' + err.message;
        }
      }

      runTest();
    </script>
  </body>
</html>
